name: MLOps CI Pipeline

on:
  push:
    branches:
      - 'feature/**'
      - 'develop'

jobs:
  # ─────────────────────────────────────────────
  # JOB 1 : Entraînement (feature/* ET develop)
  # ─────────────────────────────────────────────
  train:
    name: Installer & Entraîner le modèle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Entraîner le modèle
        run: python train.py

      - name: Afficher les métriques
        run: cat artifacts/metrics.json

      - name: Uploader les artefacts
        uses: actions/upload-artifact@v4
        with:
          name: model-artifacts
          path: artifacts/

  # ─────────────────────────────────────────────
  # JOB 2 : Build Docker (develop seulement)
  # ─────────────────────────────────────────────
  build:
    name: Build image Docker
    runs-on: ubuntu-latest
    needs: train
    if: github.ref == 'refs/heads/develop'

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Télécharger les artefacts du modèle
        uses: actions/download-artifact@v4
        with:
          name: model-artifacts
          path: artifacts/

      - name: Login sur Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build de l'image Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/wine-quality-api:latest
          load: true

      - name: Sauvegarder l'image Docker
        run: docker save ${{ secrets.DOCKERHUB_USERNAME }}/wine-quality-api:latest -o image.tar

      - name: Uploader l'image Docker
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: image.tar

  # ─────────────────────────────────────────────
  # JOB 3 : Push Docker (develop seulement)
  # ─────────────────────────────────────────────
  push:
    name: Push image Docker
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/develop'

    steps:
      - name: Télécharger l'image Docker
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Charger l'image Docker
        run: docker load -i image.tar

      - name: Login sur Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push de l'image Docker
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/wine-quality-api:latest
          docker tag ${{ secrets.DOCKERHUB_USERNAME }}/wine-quality-api:latest \
            ${{ secrets.DOCKERHUB_USERNAME }}/wine-quality-api:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/wine-quality-api:${{ github.sha }}
